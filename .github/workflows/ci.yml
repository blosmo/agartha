name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  blender-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify toolkit with the pinned Blender runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1 libxi6 libxfixes3 libxkbcommon0 libxrender1
          version="$(python3 -c 'from cloud.blender_mcp.config import BLENDER_VERSION; print(BLENDER_VERSION)')"
          archive="blender-${version}-linux-x64.tar.xz"
          runtime="$RUNNER_TEMP/blender-quality"
          mkdir -p "$runtime"
          curl --fail --silent --show-error --location --retry 3 --max-time 180 "https://download.blender.org/release/Blender4.5/$archive" -o "$runtime/$archive"
          curl --fail --silent --show-error --location --retry 3 --max-time 60 "https://download.blender.org/release/Blender4.5/blender-${version}.sha256" -o "$runtime/SHA256SUMS"
          (cd "$runtime" && grep -F "  $archive" SHA256SUMS | sha256sum --check -)
          tar -xJf "$runtime/$archive" -C "$runtime"
          timeout 240s "$runtime/blender-${version}-linux-x64/blender" --background --factory-startup --python-exit-code 1 \
            --python scripts/blender/verify_quality.py -- --kit scripts/seed/starter_kit.py \
            --output "$RUNNER_TEMP/blender-quality-results" --assert-quality --renders || {
              result=$?
              if [ -f /tmp/blender.crash.txt ]; then cat /tmp/blender.crash.txt; fi
              exit "$result"
            }
      - name: Verify managed model export excludes the studio
        run: |
          version="$(python3 -c 'from cloud.blender_mcp.config import BLENDER_VERSION; print(BLENDER_VERSION)')"
          "$RUNNER_TEMP/blender-quality/blender-${version}-linux-x64/blender" --background --factory-startup --python-exit-code 1 \
            --python scripts/blender/verify_managed_export.py -- "$RUNNER_TEMP/managed-export-results"
      - name: Verify shared PBR material export
        run: |
          version="$(python3 -c 'from cloud.blender_mcp.config import BLENDER_VERSION; print(BLENDER_VERSION)')"
          timeout 120s "$RUNNER_TEMP/blender-quality/blender-${version}-linux-x64/blender" --background --factory-startup --python-exit-code 1 \
            --python scripts/blender/verify_material_library.py -- "$RUNNER_TEMP/material-library-results"
      - name: Verify procedural material authoring and reuse
        run: |
          version="$(python3 -c 'from cloud.blender_mcp.config import BLENDER_VERSION; print(BLENDER_VERSION)')"
          timeout 180s "$RUNNER_TEMP/blender-quality/blender-${version}-linux-x64/blender" --background --factory-startup --threads 2 --python-exit-code 1 \
            --python scripts/blender/verify_material_authoring.py -- "$RUNNER_TEMP/material-authoring-results"
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:release
      - run: npm test
      - name: Test Python Blender services
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r cloud/blender_mcp/requirements-client.txt
          .venv/bin/python -m unittest discover -s cloud/blender_billing -t . -p 'test_*.py'
          .venv/bin/python -m unittest cloud.blender_mcp.test_app cloud.blender_mcp.test_runtime cloud.blender_mcp.test_transport
      - run: npm run build
      - name: Test Rust workspace
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable test --workspace --locked
