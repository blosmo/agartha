name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:release
      - run: npm test
      - name: Test Python Blender services
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r cloud/blender_mcp/requirements-client.txt
          .venv/bin/python -m unittest discover -s cloud/blender_billing -t . -p 'test_*.py'
          .venv/bin/python -m unittest cloud.blender_mcp.test_app cloud.blender_mcp.test_runtime cloud.blender_mcp.test_transport
      - run: npm run build
      - name: Test Rust workspace
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable test --workspace --locked
